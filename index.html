<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Access</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: black;
  color: #00ff9d;
  overflow: hidden;
}

/* BOTÃO */
#startBtn {
  position: fixed;
  inset: 0;
  margin: auto;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 1px solid #00ff9d;
  background: radial-gradient(circle, #003c2a, #000);
  color: #00ff9d;
  font-weight: bold;
}

/* BOOT */
#boot {
  position: fixed;
  inset: 0;
  display: none;
  padding: 15px;
}

/* LOGS */
#screen {
  max-width: 600px;
  margin: auto;
  margin-top: 8vh;
}

.line {
  margin: 6px 0;
  font-size: 14px;
  opacity: 0.85;
}

/* ALERT */
#alert {
  position: fixed;
  top: -120px;
  width: 100%;
  background: #111;
  border-bottom: 1px solid red;
  color: red;
  padding: 12px;
  transition: 0.4s;
  z-index: 10;
}

/* VIDEO */
#videoBox {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: black;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* SENHA */
#senhaBox {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: black;
}

.card {
  border: 1px solid #00ff9d;
  padding: 20px 30px;
  border-radius: 10px;
}

.senha {
  font-size: 36px;
  margin: 10px 0;
}

button {
  margin-top: 10px;
  padding: 10px;
  background: transparent;
  border: 1px solid #00ff9d;
  color: #00ff9d;
}

/* IA */
#aiBox {
  position: fixed;
  bottom: 10px;
  left: 10px;
  right: 10px;
  font-size: 12px;
  opacity: 0.8;
}

/* MAPA */
#netMap {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.12;
  pointer-events: none;
}
</style>
</head>

<body>

<button id="startBtn">CONECTAR</button>

<div id="alert">⚠ SYSTEM BREACH</div>

<div id="boot">
  <div id="screen"></div>
</div>

<canvas id="netMap"></canvas>
<div id="aiBox"></div>

<div id="videoBox">
  <video id="video" playsinline>
    <source src="0416.mp4" type="video/mp4">
  </video>
</div>

<div id="senhaBox">
  <div class="card">
    <div>ACCESS GRANTED</div>
    <div class="senha" id="senha">mauricio$2018</div>
    <button onclick="copySenha()">COPY PASSWORD</button>
  </div>
</div>

<audio id="beep" src="https://www.soundjay.com/button/sounds/button-09.mp3"></audio>
<audio id="sirene" src="https://www.soundjay.com/misc/sounds/siren-01.mp3"></audio>

<script>

/* ======================
   BOOT LOGS + TYPE
====================== */
const lines = [
  "Initializing system...",
  "Scanning network...",
  "Injecting module...",
  "Bypassing firewall...",
  "Device trace enabled...",
  "WARNING: intrusion detected"
];

let i = 0;
const screen = document.getElementById("screen");

document.getElementById("startBtn").onclick = () => {
  document.getElementById("startBtn").remove();
  document.getElementById("boot").style.display = "block";

  startAI();
  startMap();
  typeLine();
};

function typeLine() {
  if (i >= lines.length) return triggerError();

  let line = document.createElement("div");
  line.className = "line";
  screen.appendChild(line);

  let text = lines[i];
  let j = 0;

  function type() {
    if (j < text.length) {
      line.innerHTML = text.substring(0, j) + "_";
      j++;
      setTimeout(type, 25);
    } else {
      line.innerHTML = text;
      document.getElementById("beep").play().catch(()=>{});
      i++;
      setTimeout(typeLine, 600);
    }
  }

  type();
}

/* ======================
   ALERTA
====================== */
function triggerError() {

  document.getElementById("alert").style.top = "0";

  document.body.style.filter = "contrast(1.3) hue-rotate(120deg)";

  document.getElementById("sirene").play().catch(()=>{});

  if (navigator.vibrate) {
    navigator.vibrate([200,100,300,200,500]);
  }

  setTimeout(startVideo, 2500);
}

/* ======================
   VIDEO
====================== */
function startVideo() {

  document.getElementById("boot").remove();
  document.getElementById("alert").remove();
  document.getElementById("aiBox").remove();
  document.getElementById("netMap").remove();

  const box = document.getElementById("videoBox");
  const video = document.getElementById("video");

  box.style.display = "flex";

  setTimeout(() => video.play().catch(()=>{}), 300);

  video.onended = showPassword;

  setTimeout(showPassword, 20000);
}

/* ======================
   SENHA
====================== */
function showPassword() {
  document.getElementById("videoBox").remove();
  document.getElementById("senhaBox").style.display = "flex";
}

function copySenha() {
  navigator.clipboard.writeText(document.getElementById("senha").innerText);
  alert("Senha copiada!");
}

/* ======================
   IA FAKE
====================== */
const aiMsgs = [
  "AI: monitorando atividade...",
  "AI: comportamento anômalo detectado...",
  "AI: rastreando dispositivo...",
  "AI: tentativa de acesso externo...",
  "AI: bloqueio temporário ativado..."
];

let aiIndex = 0;

function startAI() {
  const box = document.getElementById("aiBox");

  setInterval(() => {
    if (aiIndex < aiMsgs.length) {
      box.innerHTML += aiMsgs[aiIndex] + "<br>";
      aiIndex++;
    }
  }, 1200);
}

/* ======================
   MAPA DE REDE
====================== */
const canvas = document.getElementById("netMap");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let nodes = [];

for (let i = 0; i < 35; i++) {
  nodes.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 1.2,
    vy: (Math.random() - 0.5) * 1.2
  });
}

function startMap() {
  draw();
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i+1; j < nodes.length; j++) {

      let dx = nodes[i].x - nodes[j].x;
      let dy = nodes[i].y - nodes[j].y;
      let dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < 120) {
        ctx.strokeStyle = "rgba(0,255,157,0.2)";
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }
  }

  for (let n of nodes) {
    n.x += n.vx;
    n.y += n.vy;

    if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
    if (n.y < 0 || n.y > canvas.height) n.vy *= -1;

    ctx.fillStyle = "#00ff9d";
    ctx.beginPath();
    ctx.arc(n.x, n.y, 2, 0, Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

</script>

</body>
</html>
