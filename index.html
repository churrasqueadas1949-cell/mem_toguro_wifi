<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Access</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  height: 100vh;
  overflow: hidden;
}

/* BOTÃO */
#startBtn {
  position: fixed;
  inset: 0;
  margin: auto;

  width: 150px;
  height: 150px;

  border-radius: 50%;
  border: none;

  background: radial-gradient(circle at 30% 30%, #2cff88, #0b6b3a);
  color: white;

  font-size: 16px;
  font-weight: bold;

  box-shadow: 0 12px 30px rgba(0,0,0,0.7),
              inset 0 -6px 12px rgba(0,0,0,0.4),
              inset 0 6px 10px rgba(255,255,255,0.15);

  cursor: pointer;
}

/* LOADING */
#loading {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.spinner {
  border: 6px solid #333;
  border-top: 6px solid #00ff00;
  border-radius: 50%;
  width: 70px;
  height: 70px;
  animation: spin 1.2s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

#logs {
  margin-top: 20px;
  font-size: 14px;
  opacity: 0.8;
  text-align: center;
}

/* NOTIF */
#notif {
  position: fixed;
  top: -120px;
  width: 100%;
  background: #202124;
  padding: 14px;
  font-size: 13px;
  transition: top 0.5s ease;
  z-index: 10;
}

/* POPUP */
#popup {
  position: fixed;
  bottom: -200px;
  width: 100%;
  background: #1c1c1c;
  padding: 18px;
  border-top: 3px solid red;
  transition: bottom 0.5s ease;
  z-index: 10;
}

/* SHAKES */
.shake {
  animation: shake 0.2s infinite;
}

@keyframes shake {
  0% { transform: translate(1px, 1px); }
  50% { transform: translate(-1px, -1px); }
  100% { transform: translate(1px, -1px); }
}

.glitch {
  animation: glitch 0.15s infinite;
}

@keyframes glitch {
  0% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(120deg) contrast(1.2); }
  100% { filter: hue-rotate(0deg); }
}

/* FINAL */
#final {
  display: none;
  position: fixed;
  inset: 0;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: radial-gradient(circle at center, #0a0a0a, black 70%);
}

/* VIDEO CINEMATOGRÁFICO */
video {
  width: 95%;
  max-width: 540px;
  border-radius: 14px;

  opacity: 0;
  transform: scale(1.08);
  filter: blur(10px);

  transition: opacity 0.8s ease,
              transform 0.8s ease,
              filter 0.8s ease;
}

/* SENHA */
#senhaBox {
  margin-top: 20px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 14px;
  padding: 18px 28px;
  backdrop-filter: blur(8px);

  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
}

.titulo {
  font-size: 14px;
  opacity: 0.7;
}

.senha {
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<!-- BOTÃO -->
<button id="startBtn">CONECTAR</button>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <div id="logs"></div>
</div>

<!-- NOTIF -->
<div id="notif">⚠ System<br>Network anomaly detected</div>

<!-- POPUP -->
<div id="popup"></div>

<!-- FINAL -->
<div id="final">

  <video id="video" playsinline preload="auto">
    <source src="0416.mp4" type="video/mp4">
  </video>

  <div id="senhaBox">
    <div class="titulo">🔑 Acesso Wi-Fi</div>
    <div class="senha">mauricio$2018</div>
  </div>

</div>

<script>

document.getElementById("startBtn").onclick = () => {
  document.getElementById("startBtn").remove();
  document.getElementById("loading").style.display = "flex";
  iniciar();
};

const logs = [
  "Acessando rede...",
  "Verificando conexão...",
  "Sincronizando servidores...",
  "Estabilizando resposta...",
  "Analisando tráfego...",
  "Quase concluído..."
];

let i = 0;

function iniciar() {
  setTimeout(loop, 800);
}

function loop() {

  if (i < logs.length) {

    let p = document.createElement("p");
    p.innerText = logs[i];
    document.getElementById("logs").appendChild(p);

    i++;
    setTimeout(loop, 1000 + Math.random() * 800);

  } else {
    setTimeout(erro, 1000);
  }
}

function erro() {

  document.getElementById("notif").style.top = "0";
  document.getElementById("popup").style.bottom = "0";
  document.getElementById("popup").innerHTML =
    "<b>Instabilidade detectada</b><br>Reestabelecendo conexão...";

  document.body.classList.add("shake");

  setTimeout(() => {
    document.body.classList.add("glitch");
  }, 1200);

  setTimeout(travar, 2800);
}

function travar() {

  document.getElementById("loading").style.display = "none";
  document.getElementById("popup").style.display = "none";

  const final = document.getElementById("final");
  final.style.display = "flex";

  const video = document.getElementById("video");

  // 🎬 entrada cinematográfica
  setTimeout(() => {
    video.style.opacity = "1";
    video.style.transform = "scale(1)";
    video.style.filter = "blur(0px)";

    video.play().catch(() => {
      video.muted = true;
      video.play();
    });

  }, 300);

  video.onended = () => {
    document.getElementById("senhaBox").style.opacity = "1";
    document.getElementById("senhaBox").style.transform = "translateY(0)";
  };
}

</script>

</body>
</html>
