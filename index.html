<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Access</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  height: 100vh;
  overflow: hidden;
}

/* BOTÃO */
#startBtn {
  position: fixed;
  inset: 0;
  margin: auto;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: none;
  background: radial-gradient(circle at 30% 30%, #2cff88, #0b6b3a);
  color: white;
  font-weight: bold;
}

/* BOOT */
#loading {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* LOGS */
#logs {
  margin-top: 20px;
  font-size: 14px;
  opacity: 0.85;
  text-align: center;
}

/* NOTIF */
#notif {
  position: fixed;
  top: -120px;
  width: 100%;
  background: #202124;
  padding: 14px;
  transition: top 0.4s;
  z-index: 10;
}

/* POPUP */
#popup {
  position: fixed;
  bottom: -200px;
  width: 100%;
  background: #1c1c1c;
  padding: 18px;
  border-top: 3px solid red;
  transition: bottom 0.4s;
  z-index: 10;
}

/* GLITCH */
.shake {
  animation: shake 0.08s infinite;
}

@keyframes shake {
  0% { transform: translate(2px,2px); }
  50% { transform: translate(-2px,-2px); }
  100% { transform: translate(2px,2px); }
}

.corrupt {
  animation: corrupt 0.06s infinite;
}

@keyframes corrupt {
  0% { filter: hue-rotate(0deg) contrast(1); }
  50% { filter: hue-rotate(140deg) contrast(1.5); }
  100% { filter: hue-rotate(0deg) contrast(1); }
}

/* 💥 VIDRO RACHADO OVERLAY */
#crack {
  position: fixed;
  inset: 0;
  background: url("https://i.imgur.com/3g7nmJC.png") center/cover no-repeat;
  opacity: 0;
  pointer-events: none;
  transition: 0.4s;
  mix-blend-mode: screen;
  z-index: 5;
}

/* FINAL */
#final {
  display: none;
  position: fixed;
  inset: 0;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* VIDEO */
video {
  width: 95%;
  max-width: 500px;
  border-radius: 12px;
  opacity: 0;
  transform: scale(0.8);
  transition: 0.6s ease;
  object-fit: cover;
}

/* SENHA */
#senhaBox {
  margin-top: 20px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 14px;
  padding: 18px 28px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
}

.senha {
  font-size: 34px;
  font-weight: bold;
}
</style>
</head>

<body>

<button id="startBtn">CONECTAR</button>

<div id="notif">⚠ System<br>Network anomaly detected</div>
<div id="popup"></div>

<div id="crack"></div>

<div id="loading">
  <div id="logs"></div>
</div>

<div id="final">

  <video id="video" playsinline preload="auto">
    <source src="0416.mp4" type="video/mp4">
  </video>

  <div id="senhaBox">
    <div>🔑 Acesso Wi-Fi</div>
    <div class="senha">mauricio$2018</div>
  </div>

</div>

<!-- SIRENE -->
<audio id="sirene" src="https://www.soundjay.com/misc/sounds/siren-01.mp3"></audio>

<!-- BEEPS BOOT -->
<audio id="beep1" src="https://www.soundjay.com/button/sounds/button-09.mp3"></audio>
<audio id="beep2" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>
<audio id="beep3" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>

<script>

const logs = [
  "Iniciando kernel...",
  "Carregando módulos...",
  "Bypass de segurança...",
  "Escaneando rede local...",
  "Injeção de pacote suspeito...",
  "SISTEMA COMPROMETIDO"
];

let i = 0;

document.getElementById("startBtn").onclick = () => {
  document.getElementById("startBtn").remove();
  document.getElementById("loading").style.display = "flex";

  bootLoop();
};

/* 🔊 SOM SINCRONIZADO POR LINHA */
function playSound(index) {
  const sounds = [
    document.getElementById("beep1"),
    document.getElementById("beep2"),
    document.getElementById("beep3")
  ];

  let s = sounds[index % sounds.length];
  s.currentTime = 0;
  s.play().catch(()=>{});
}

/* BOOT */
function bootLoop() {

  if (i < logs.length) {

    let p = document.createElement("p");
    p.innerText = logs[i];
    document.getElementById("logs").appendChild(p);

    playSound(i); // 🔊 sincronizado

    i++;

    setTimeout(bootLoop, 800 + Math.random()*600);

  } else {
    setTimeout(erro, 800);
  }
}

/* 💀 ERRO + CORRUPÇÃO */
function erro() {

  document.getElementById("notif").style.top = "0";
  document.getElementById("popup").style.bottom = "0";
  document.getElementById("popup").innerHTML = "<b>SYSTEM BREACH DETECTED</b>";

  document.body.classList.add("shake", "corrupt");

  // 💥 vidro rachando
  const crack = document.getElementById("crack");
  crack.style.opacity = "1";

  // 🔊 sirene
  const s = document.getElementById("sirene");
  s.currentTime = 0;
  s.play().catch(()=>{});

  // 📳 vibração
  if (navigator.vibrate) {
    navigator.vibrate([200,100,300,100,500,200,600]);
  }

  setTimeout(iniciarVideo, 2500);
}

/* 🎬 VÍDEO */
function iniciarVideo() {

  document.body.classList.remove("shake","corrupt");

  document.getElementById("loading").remove();
  document.getElementById("notif").remove();
  document.getElementById("popup").remove();
  document.getElementById("crack").remove();

  const video = document.getElementById("video");
  const final = document.getElementById("final");

  final.style.display = "flex";

  setTimeout(() => {
    video.style.opacity = "1";
    video.style.transform = "scale(1)";
    video.play().catch(()=>{});
  }, 200);

  video.onended = mostrarSenha;

  setTimeout(mostrarSenha, 20000);
}

/* 🔑 SENHA */
function mostrarSenha() {

  document.getElementById("video").style.display = "none";

  const box = document.getElementById("senhaBox");
  box.style.opacity = "1";
  box.style.transform = "translateY(0)";
}

</script>

</body>
</html>
