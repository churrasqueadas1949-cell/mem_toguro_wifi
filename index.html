<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Boot</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

/* BOTÃO */
#startBtn {
  position: fixed;
  inset: 0;
  margin: auto;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: none;
  background: radial-gradient(circle at 30% 30%, #2cff88, #0b6b3a);
  color: white;
  font-weight: bold;
}

/* BOOT */
#boot {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#logs {
  margin-top: 20px;
  font-size: 14px;
  opacity: 0.8;
  text-align: center;
}

/* ALERT */
#alert {
  position: fixed;
  top: -120px;
  width: 100%;
  background: #202124;
  padding: 14px;
  transition: 0.4s;
}

#popup {
  position: fixed;
  bottom: -200px;
  width: 100%;
  background: #1c1c1c;
  padding: 18px;
  border-top: 3px solid red;
  transition: 0.4s;
}

/* GLITCH */
.glitch {
  animation: glitch 0.12s infinite;
}

@keyframes glitch {
  0% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(120deg) contrast(1.3); }
  100% { filter: hue-rotate(0deg); }
}

/* VIDEO FULL REAL (SEM PISCAR) */
#videoContainer {
  position: fixed;
  inset: 0;
  display: none;
  background: black;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* SENHA */
#senhaBox {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: black;
}

.card {
  background: rgba(255,255,255,0.08);
  padding: 20px 30px;
  border-radius: 14px;
  backdrop-filter: blur(10px);
}

.senha {
  font-size: 36px;
  font-weight: bold;
}
</style>
</head>

<body>

<button id="startBtn">CONECTAR</button>

<div id="alert">⚠ SYSTEM WARNING</div>
<div id="popup"></div>

<div id="boot">
  <div>BOOTING SYSTEM...</div>
  <div id="logs"></div>
</div>

<div id="videoContainer">
  <video id="video" playsinline>
    <source src="0416.mp4" type="video/mp4">
  </video>
</div>

<div id="senhaBox">
  <div class="card">
    <div>🔑 WI-FI ACCESS</div>
    <div class="senha">mauricio$2018</div>
  </div>
</div>

<audio id="sirene"
src="https://www.soundjay.com/misc/sounds/siren-01.mp3"></audio>

<script>

const logs = [
  "Initializing system...",
  "Checking network...",
  "Injecting modules...",
  "Scanning device...",
  "Security bypass attempt...",
  "SYSTEM ERROR DETECTED..."
];

let i = 0;

document.getElementById("startBtn").onclick = () => {

  document.getElementById("startBtn").remove();
  document.getElementById("boot").style.display = "flex";

  iniciarLogs();
};

function iniciarLogs() {

  if (i < logs.length) {

    let p = document.createElement("p");
    p.innerText = logs[i];
    document.getElementById("logs").appendChild(p);

    if (i === logs.length - 1) iniciarErro();

    i++;
    setTimeout(iniciarLogs, 900);

  }
}

function iniciarErro() {

  document.getElementById("alert").style.top = "0";
  document.getElementById("popup").style.bottom = "0";
  document.getElementById("popup").innerHTML = "<b>CRITICAL FAILURE</b>";

  document.body.classList.add("glitch");

  // 🔊 SOM (só funciona no clique → agora garantido)
  const sirene = document.getElementById("sirene");
  sirene.currentTime = 0;
  sirene.play().catch(()=>{});

  // 📳 vibração REAL
  if (navigator.vibrate) {
    navigator.vibrate([200,100,200,100,500]);
  }

  setTimeout(iniciarVideo, 2200);
}

function iniciarVideo() {

  document.getElementById("boot").remove();
  document.getElementById("alert").remove();
  document.getElementById("popup").remove();

  const container = document.getElementById("videoContainer");
  container.style.display = "block";

  const video = document.getElementById("video");

  video.play().catch(()=>{});

  let acabou = false;

  video.onended = () => {
    acabou = true;
    mostrarSenha();
  };

  setTimeout(() => {
    if (!acabou) mostrarSenha();
  }, 20000);
}

function mostrarSenha() {

  document.getElementById("videoContainer").remove();

  const box = document.getElementById("senhaBox");
  box.style.display = "flex";
}

</script>

</body>
</html>
