<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Status</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

/* BOTÃO */
#startBtn {
  position: fixed;
  inset: 0;
  margin: auto;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: none;
  background: radial-gradient(circle at 30% 30%, #2cff88, #0b6b3a);
  color: white;
  font-weight: bold;
}

/* BOOT */
#loading {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* LOGS */
#logs {
  text-align: center;
  font-size: 14px;
  opacity: 0.85;
}

/* ALERTA */
#notif {
  position: fixed;
  top: -120px;
  width: 100%;
  background: #111;
  padding: 12px;
  transition: 0.4s;
  border-bottom: 1px solid red;
}

/* OVERLAY */
#overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

/* VIDEO */
#videoBox {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: black;
}

video {
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  opacity: 0;
  transition: 0.6s;
}

/* SENHA */
#senhaBox {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 12px;
}

.senha {
  font-size: 34px;
  margin: 10px 0;
}

button {
  margin-top: 10px;
  padding: 10px 14px;
  background: transparent;
  border: 1px solid white;
  color: white;
}

/* animação leve */
@keyframes pop {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<button id="startBtn">CONECTAR</button>

<div id="notif">⚠ System Alert</div>

<div id="loading">
  <div id="logs"></div>
</div>

<div id="overlay"></div>

<div id="videoBox">
  <video id="video" playsinline>
    <source src="0416.mp4" type="video/mp4">
  </video>
</div>

<div id="senhaBox">
  <div class="card">
    <div>🔑 ACCESS KEY</div>
    <div class="senha" id="senha">mauricio$2018</div>
    <button onclick="copiar()">COPIAR SENHA</button>
  </div>
</div>

<!-- ÁUDIOS -->
<audio id="sirene" src="SIRENE.mp3"></audio>
<audio id="errorSound" src="ERRO+SIRENE.mp3"></audio>
<audio id="failSound" src="FALHA CELULAR.mp3"></audio>

<script>

const logs = [
  "Initializing system...",
  "Checking network...",
  "Verifying security...",
  "Connection unstable...",
  "Handshake lost..."
];

let i = 0;

document.getElementById("startBtn").onclick = () => {
  document.getElementById("startBtn").remove();
  document.getElementById("loading").style.display = "flex";
  loop();
};

/* BOOT (CORRIGIDO: SEM ÁUDIO) */
function loop() {
  if (i < logs.length) {

    let p = document.createElement("p");
    p.innerText = logs[i];
    document.getElementById("logs").appendChild(p);

    i++;
    setTimeout(loop, 1200);

  } else {
    setTimeout(startChaos, 900);
  }
}

/* CAOS (INALTERADO) */
function startChaos() {

  document.getElementById("loading").remove();
  document.getElementById("notif").style.top = "0";
  document.body.classList.add("glitch");

  const overlay = document.getElementById("overlay");

  const msgs = [
    "net::conn reset 10.0.0.12",
    "auth token expired (session 4f91)",
    "packet loss 18% wlan0",
    "sync retry failed /api/v3",
    "process halted: file_lock_error",
    "PIX transfer queued BRADESCO",
    "transfer aborted user GABRIEL M.S. ****",
    "encrypted vault access denied",
    "db rollback #88391",
    "session hijack attempt blocked",
    "dns unstable srv br-prod-02",
    "background service restart loop",
    "TLS handshake interrupted",
    "cache desync retry",
    "PIX revalidation timeout",
    "file stream corrupted /secure/****",
    "routing mismatch eth0/wlan0",
    "banking API partial response"
  ];

  let j = 0;

  function spawn() {

    if (j >= msgs.length) {
      setTimeout(() => {
        overlay.innerHTML = "";
        startVideo();
      }, 1200);
      return;
    }

    const box = document.createElement("div");

    const x = (Math.random() * 100 - 50);
    const y = (Math.random() * 80 - 40);

    box.style.position = "fixed";
    box.style.left = "50%";
    box.style.top = "50%";
    box.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

    box.style.width = "88%";
    box.style.maxWidth = "420px";

    box.style.padding = "10px 12px";
    box.style.borderRadius = "6px";

    box.style.background = "rgba(0,0,0,0.85)";
    box.style.borderLeft = "3px solid #ff3b3b";
    box.style.boxShadow = "0 0 12px rgba(255,0,0,0.25)";
    box.style.fontSize = "12px";
    box.style.fontFamily = "monospace";
    box.style.color = "#e6e6e6";

    box.innerHTML = `<div>${msgs[j % msgs.length]}</div>`;

    overlay.appendChild(box);

   setTimeout(() => box.remove(), 450 + Math.random() * 250);

    if (j === 0) {
      document.getElementById("sirene").play().catch(()=>{});
    }

    if (j % 3 === 0) {
      document.getElementById("errorSound").currentTime = 0;
      document.getElementById("errorSound").play().catch(()=>{});
    }

    if (navigator.vibrate) {
      navigator.vibrate([40, 30, 80]);
    }

    j++;
    setTimeout(spawn, 120 + Math.random() * 180);
  }

  spawn();
}

/* VIDEO */
function startVideo() {

  document.getElementById("overlay").remove();
  document.getElementById("notif").remove();

  const box = document.getElementById("videoBox");
  const video = document.getElementById("video");

  box.style.display = "flex";

  requestAnimationFrame(() => {
    video.style.opacity = "1";
    video.play().catch(()=>{});
  });

  video.onended = showSenha;
  setTimeout(showSenha, 20000);
}

/* SENHA */
function showSenha() {
  document.getElementById("videoBox").remove();
  document.getElementById("senhaBox").style.display = "flex";
}

function copiar() {
  navigator.clipboard.writeText(document.getElementById("senha").innerText);
  alert("Senha copiada!");
}

</script>

</body>
</html>
