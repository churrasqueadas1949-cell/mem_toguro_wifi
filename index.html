<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Status</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

/* BOTÃO */
#startBtn {
  position: fixed;
  inset: 0;
  margin: auto;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: none;
  background: radial-gradient(circle at 30% 30%, #2cff88, #0b6b3a);
  color: white;
  font-weight: bold;
}

/* BOOT */
#loading {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* LOGS */
#logs {
  text-align: center;
  font-size: 14px;
  opacity: 0.85;
}

/* ALERTA */
#notif {
  position: fixed;
  top: -120px;
  width: 100%;
  background: #111;
  padding: 12px;
  transition: 0.4s;
  border-bottom: 1px solid red;
}

#popup {
  position: fixed;
  bottom: -200px;
  width: 100%;
  background: #1a1a1a;
  padding: 18px;
  border-top: 2px solid red;
  transition: 0.4s;
}

/* CAOS VISUAL */
.shake {
  animation: shake 0.08s infinite;
}

@keyframes shake {
  0% { transform: translate(2px,2px); }
  50% { transform: translate(-2px,-2px); }
  100% { transform: translate(2px,2px); }
}

.glitch {
  animation: glitch 0.1s infinite;
}

@keyframes glitch {
  0% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(120deg) contrast(1.4); }
  100% { filter: hue-rotate(0deg); }
}

/* VIDEO */
#videoBox {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: black;
}

video {
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.6s ease;
}

/* SENHA */
#senhaBox {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 12px;
}

.senha {
  font-size: 34px;
  margin: 10px 0;
}

button {
  margin-top: 10px;
  padding: 10px 14px;
  background: transparent;
  border: 1px solid white;
  color: white;
}
</style>
</head>

<body>

<button id="startBtn">CONECTAR</button>

<div id="notif">⚠ System Alert</div>
<div id="popup"></div>

<div id="loading">
  <div id="logs"></div>
</div>

<div id="videoBox">
  <video id="video" playsinline>
    <source src="0416.mp4" type="video/mp4">
  </video>
</div>

<div id="senhaBox">
  <div class="card">
    <div>🔑 ACCESS KEY</div>
    <div class="senha" id="senha">mauricio$2018</div>
    <button onclick="copiar()">COPIAR SENHA</button>
  </div>
</div>

<audio id="sirene" src="https://www.soundjay.com/misc/sounds/siren-01.mp3"></audio>

<script>

const logs = [
  "Initializing system...",
  "Checking network...",
  "Verifying security...",
  "Connection unstable...",
  "System anomaly detected..."
];

let i = 0;

document.getElementById("startBtn").onclick = () => {
  document.getElementById("startBtn").remove();
  document.getElementById("loading").style.display = "flex";
  loop();
};

/* BOOT */
function loop() {

  if (i < logs.length) {

    let p = document.createElement("p");
    p.innerText = logs[i];
    document.getElementById("logs").appendChild(p);

    i++;
    setTimeout(loop, 1400);

  } else {
    setTimeout(failureSequence, 1200);
  }
}

/* CAOS CONTROLADO */
function failureSequence() {

  document.getElementById("notif").style.top = "0";

  document.body.classList.add("shake","glitch");

  const popup = document.getElementById("popup");

  const msgs = [
    "WARNING: system instability",
    "critical process failure",
    "security breach detected",
    "network corruption increasing",
    "emergency shutdown initiated"
  ];

  let j = 0;

  const interval = setInterval(() => {

    if (j >= msgs.length) {
      clearInterval(interval);
      setTimeout(playVideo, 1800);
      return;
    }

    popup.innerHTML = msgs[j];
    popup.style.bottom = "0";

    if (navigator.vibrate) {
      navigator.vibrate(100 + j * 50);
    }

    if (j === 2) {
      document.getElementById("sirene").play().catch(()=>{});
    }

    j++;

  }, 1500);
}

/* VIDEO */
function playVideo() {

  document.getElementById("loading").remove();
  document.getElementById("notif").remove();
  document.getElementById("popup").remove();

  document.body.classList.remove("shake","glitch");

  const box = document.getElementById("videoBox");
  const video = document.getElementById("video");

  box.style.display = "flex";

  requestAnimationFrame(() => {
    video.style.opacity = "1";
    video.play().catch(()=>{});
  });

  video.onended = showSenha;

  setTimeout(showSenha, 20000);
}

/* SENHA */
function showSenha() {

  document.getElementById("videoBox").remove();

  const box = document.getElementById("senhaBox");
  box.style.display = "flex";
}

function copiar() {
  navigator.clipboard.writeText(document.getElementById("senha").innerText);
  alert("Senha copiada!");
}

</script>

</body>
</html>
